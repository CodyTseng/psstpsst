[package]
name = "psstpsst-proximity"
version = "1.0.0"
edition = "2024"
license = "MIT"

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
futures = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }
windows = { version = "0.62.2", features = [
  "Devices_Bluetooth",
  "Devices_Bluetooth_Advertisement",
  "Devices_Bluetooth_GenericAttributeProfile",
  "Devices_Enumeration",
  "Devices_Radios",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_System_WinRT",
] }
