[package]
name = "psstpsst-proximity"
version = "1.0.0"
edition = "2024"
license = "MIT"

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
futures = "0.3.31"
libdbus-sys = { version = "0.2.7", features = ["vendored"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }
