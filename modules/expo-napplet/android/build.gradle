plugins {
  id 'com.android.library'
  id 'org.jetbrains.kotlin.android'
}
group = 'chat.psstpsst.app'
version = '0.1.0'
android {
  namespace 'chat.psstpsst.app.napplet'
  compileSdk rootProject.ext.compileSdkVersion
  defaultConfig {
    minSdkVersion rootProject.ext.minSdkVersion
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  }
  sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/nappletTestAssets')
}
dependencies {
  implementation project(':expo-modules-core')
  implementation 'androidx.webkit:webkit:1.14.0'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  testImplementation 'junit:junit:4.13.2'
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}

def generateNappletTestFixture = tasks.register('generateNappletTestFixture', Exec) {
  workingDir rootProject.projectDir.parentFile
  commandLine 'node', 'scripts/generate-napplet-android-fixture.mjs',
    layout.buildDirectory.dir('generated/nappletTestAssets').get().asFile.absolutePath
  inputs.files('../../../src/services/napplet/document.ts', '../../../src/services/napplet/prelude.generated.ts',
    '../../../scripts/generate-napplet-android-fixture.mjs')
  outputs.dir layout.buildDirectory.dir('generated/nappletTestAssets')
}
tasks.matching { it.name == 'mergeDebugAndroidTestAssets' }.configureEach {
  dependsOn generateNappletTestFixture
}
