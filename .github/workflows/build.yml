name: Build Apps

on:
  workflow_dispatch:
    inputs:
      macos:
        description: macOS architecture
        type: choice
        default: arm64
        options: [none, arm64]
      windows:
        description: Windows architectures
        type: choice
        default: all
        options: [none, x64, arm64, all]
      linux:
        description: Linux architectures
        type: choice
        default: all
        options: [none, x64, arm64, all]
      android:
        description: 'Android packages (all: APK plus AAB when signing is configured)'
        type: choice
        default: all
        options: [none, apk, aab, all]
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_REPOSITORY: codytseng/psstpsst
  EXPO_PUBLIC_APP_ENV: production

jobs:
  validate-version:
    name: Validate version and signing
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      desktop: ${{ steps.targets.outputs.desktop }}
      android: ${{ steps.targets.outputs.android }}
      apk: ${{ steps.targets.outputs.apk }}
      aab: ${{ steps.targets.outputs.aab }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Select build targets
        id: targets
        env:
          HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
        run: node scripts/build-targets.mjs
      - name: Verify Android build image
        if: steps.targets.outputs.android == 'true'
        run: bash scripts/build-android-reproducible.sh --check-image
      - name: Verify third-party notices
        run: |
          npm run licenses:check
          npm run licenses:test
      - name: Validate signing configuration
        env:
          BUILD_MACOS: ${{ steps.targets.outputs.macos }}
          BUILD_ANDROID: ${{ steps.targets.outputs.android }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$BUILD_MACOS" == 'true' ]]; then
            node scripts/release-signing.mjs check macos
          fi
          if [[ "$BUILD_ANDROID" == 'true' ]]; then
            node scripts/release-signing.mjs check android
          fi
      - name: Match tag to desktop and Android versions
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ "${GITHUB_REPOSITORY,,}" != "$RELEASE_REPOSITORY" ]]; then
            echo "Tag releases must run in $RELEASE_REPOSITORY, not $GITHUB_REPOSITORY."
            exit 1
          fi

          expected="v$(node -p "require('./desktop/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match desktop/package.json version $expected."
            exit 1
          fi

          expected_android="v$(node -p "require('./app.json').expo.version")"
          if [[ "$GITHUB_REF_NAME" != "$expected_android" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app.json version $expected_android."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            /^## / { if (found) exit; if ($0 == "## [" version "]") found = 1; next }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]] || ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::Release notes are missing or empty in CHANGELOG.md for $version."
            exit 1
          fi

          base_version_code="$(node -p "require('./app.json').expo.android.versionCode")"
          for abi_suffix in 0 1 2 3 4; do
            version_code="$((base_version_code * 10 + abi_suffix))"
            notes_file="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
            if [[ ! -s "$notes_file" ]] || ! grep -q '[^[:space:]]' "$notes_file"; then
              echo "Release notes are missing or empty: $notes_file"
              exit 1
            fi

            notes_characters="$(wc -m < "$notes_file")"
            if (( notes_characters > 500 )); then
              echo "Release notes exceed the 500-character store limit: $notes_file"
              exit 1
            fi
          done

  build:
    name: ${{ matrix.name }}
    needs: validate-version
    if: needs.validate-version.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate-version.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: npm

      - name: Use stable Rust
        if: runner.os != 'macOS'
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        shell: bash
        env:
          npm_config_script_shell: bash
          CSC_LINK: ${{ startsWith(matrix.runner, 'macos-') && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(matrix.runner, 'macos-') && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.runner, 'macos-') && secrets.APPLE_TEAM_ID || '' }}
          WIN_CSC_LINK: ${{ startsWith(matrix.runner, 'windows-') && secrets.WIN_CSC_LINK || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(matrix.runner, 'windows-') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
        run: |
          signing_args=()
          if [[ "$RUNNER_OS" == "macOS" && -z "${CSC_LINK:-}" ]]; then
            echo "MAC_CSC_LINK is not configured; producing an unsigned macOS artifact."
            signing_args+=(--config.mac.forceCodeSigning=false --config.mac.identity=null)
            signing_args+=(--config.mac.hardenedRuntime=false --config.mac.notarize=false)
          fi
          npm run electron:package:signed -- ${{ matrix.builder-args }} "${signing_args[@]}"

      - name: Verify macOS signature and notarization
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [[ -n "$CSC_LINK" ]]; then
            codesign --verify --deep --strict --verbose=2 release/mac-arm64/PsstPsst.app
            spctl --assess --type execute --verbose=2 release/mac-arm64/PsstPsst.app
            xcrun stapler validate release/mac-arm64/PsstPsst.app
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.AppImage
            release/*.blockmap
            release/*.deb
            release/*.dmg
            release/*.exe
            release/*.yml
            release/*.zip
            !release/builder-*.yml
            !release/builder-*.yaml

  build-android:
    name: Android packages
    needs: validate-version
    if: needs.validate-version.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI: '1'
      NODE_ENV: production
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      ANDROID_GRADLE_JVMARGS: '-Xmx8g -XX:MaxMetaspaceSize=1g'
      ANDROID_GRADLE_WORKERS: '2'
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Install APK signing tools
        run: sdkmanager "build-tools;36.0.0"

      - name: Prepare Android download cache
        run: |
          mkdir -p "$RUNNER_TEMP/android-downloads"
          echo "ANDROID_DOWNLOAD_CACHE=$RUNNER_TEMP/android-downloads" >> "$GITHUB_ENV"

      - name: Restore Android downloads
        id: android_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.ANDROID_DOWNLOAD_CACHE }}
          key: android-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/build-android-reproducible.sh', 'scripts/android-download-cache.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            android-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'scripts/build-android-reproducible.sh', 'scripts/android-download-cache.sh') }}-

      - name: Build Android packages in the F-Droid environment
        shell: bash
        env:
          ANDROID_RELEASE_UNSIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && '1' || '0' }}
          ANDROID_BUILD_APK: ${{ needs.validate-version.outputs.apk == 'true' && '1' || '0' }}
          ANDROID_BUILD_BUNDLE: ${{ needs.validate-version.outputs.aab == 'true' && '1' || '0' }}
        run: |
          bash scripts/build-android-reproducible.sh release/fdroid-build

      - name: Verify independent APK rebuild
        if: needs.validate-version.outputs.apk == 'true' && env.HAS_ANDROID_SIGNING == 'true'
        env:
          ANDROID_RELEASE_UNSIGNED: '1'
          ANDROID_BUILD_APK: '1'
          ANDROID_BUILD_BUNDLE: '0'
        run: |
          bash scripts/build-android-reproducible.sh release/fdroid-rebuild
          node scripts/compare-android-builds.mjs release/fdroid-build release/fdroid-rebuild

      - name: Save Android downloads
        if: always() && steps.android_cache.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.ANDROID_DOWNLOAD_CACHE }}
          key: ${{ steps.android_cache.outputs.cache-primary-key }}

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            release/fdroid-build/diagnostics/
            release/fdroid-rebuild/diagnostics/

      - name: Sign and verify APK
        if: needs.validate-version.outputs.apk == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/release-signing.mjs sign-android \
            release/fdroid-build/app-release.apk \
            release/PsstPsst-android-universal.apk
          for target in armeabi-v7a:arm32 arm64-v8a:arm64 x86:x86 x86_64:x64; do
            abi="${target%:*}"
            architecture="${target#*:}"
            node scripts/release-signing.mjs sign-android \
              "release/fdroid-build/app-${abi}-release.apk" \
              "release/PsstPsst-android-${architecture}.apk"
          done

      - name: Upload APK
        if: needs.validate-version.outputs.apk == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          if-no-files-found: error
          retention-days: 14
          path: release/*.apk

      - name: Sign and verify AAB
        if: needs.validate-version.outputs.aab == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node scripts/release-signing.mjs sign-android-bundle \
            release/fdroid-build/app-release.aab \
            release/PsstPsst-android.aab

      - name: Upload AAB
        if: needs.validate-version.outputs.aab == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-aab
          if-no-files-found: error
          retention-days: 14
          path: release/PsstPsst-android.aab

      - name: Audit F-Droid signature compatibility (non-blocking)
        id: fdroid_audit
        if: needs.validate-version.outputs.apk == 'true' && env.HAS_ANDROID_SIGNING == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          PYTHON: ${{ runner.temp }}/fdroid-verifier/bin/python
        run: |
          python3 -m venv "$RUNNER_TEMP/fdroid-verifier"
          "$PYTHON" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            --retries 2 \
            --timeout 20 \
            --requirement scripts/fdroid-reproducibility-requirements.txt
          node scripts/verify-fdroid-reproducibility.mjs \
            release/fdroid-build/app-release.apk \
            release/PsstPsst-android-universal.apk
          for target in armeabi-v7a:arm32 arm64-v8a:arm64 x86:x86 x86_64:x64; do
            abi="${target%:*}"
            architecture="${target#*:}"
            node scripts/verify-fdroid-reproducibility.mjs \
              "release/fdroid-build/app-${abi}-release.apk" \
              "release/PsstPsst-android-${architecture}.apk"
          done

      - name: Report F-Droid audit failure
        if: always() && steps.fdroid_audit.outcome == 'failure'
        run: echo "::warning::F-Droid signature audit failed; the APK was already uploaded and the release will continue."

  publish-draft:
    name: Publish draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: electron-*
          path: release-assets
          merge-multiple: true

      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: release-assets

      - name: Download Android AAB
        uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: release-assets

      - name: Validate release assets
        run: node scripts/release-assets.mjs release-assets

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes_file="$RUNNER_TEMP/release-notes.md"
          awk -v version="$version" '
            /^## / { if (found) exit; if ($0 == "## [" version "]") found = 1; next }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [[ ! -s "$notes_file" ]] || ! grep -q '[^[:space:]]' "$notes_file"; then
            echo "::error::Release notes are missing or empty in CHANGELOG.md for $version."
            exit 1
          fi
          if draft_state="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --json isDraft \
              --jq .isDraft \
              2>/dev/null
          )"; then
            if [[ "$draft_state" != "true" ]]; then
              echo "::error::Release $GITHUB_REF_NAME is already published; refusing to replace live update assets."
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --title "PsstPsst $version" \
              --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$RELEASE_REPOSITORY" \
              --draft \
              --verify-tag \
              --notes-file "$notes_file" \
              --title "PsstPsst $version"
          fi

          gh release upload "$GITHUB_REF_NAME" release-assets/* \
            --repo "$RELEASE_REPOSITORY" \
            --clobber
